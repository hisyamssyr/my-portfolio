<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("../public/fonts/fraunces-latin-standard-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("../public/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../public/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 100 800;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: #f4f1ea;
        color: #14130f;
        font-family: "Instrument Sans", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 64px;
        background-image: radial-gradient(rgba(20, 19, 15, 0.14) 1px, transparent 1px);
        background-size: 22px 22px;
        overflow: hidden;
      }

      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #56534a;
      }

      .rule {
        height: 1px;
        background: rgba(20, 19, 15, 0.14);
      }

      h1 {
        font-family: "Fraunces", serif;
        font-weight: 560;
        font-size: 118px;
        line-height: 0.95;
        letter-spacing: -0.02em;
      }

      .dot {
        display: inline-block;
        width: 16px;
        height: 16px;
        background: #e8431f;
        margin-left: 10px;
        vertical-align: 12px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 24px;
      }

      .tagline {
        font-size: 24px;
        color: #56534a;
        max-width: 560px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="row">
        <span class="mono">Surabaya, ID — 7.26°S 112.75°E</span>
        <span class="mono">ITS — Informatics, 2024–2028</span>
      </div>
      <div class="rule" style="margin-top: 18px"></div>
    </div>

    <h1>
      Hisyam<br />
      Syafa Raditya<span class="dot"></span>
    </h1>

    <div>
      <div class="rule" style="margin-bottom: 20px"></div>
      <div class="bottom">
        <p class="tagline">Informatics student building data and agentic-AI systems.</p>
        <span class="mono">hisyamsyafa2@gmail.com · github.com/hisyamssyr</span>
      </div>
    </div>
  </body>
</html>
